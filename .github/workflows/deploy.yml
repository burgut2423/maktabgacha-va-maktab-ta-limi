name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:
  schedule:
    # qoshkopir-mmtb.uz dan har 2 soatda yangi ma'lumotlarni olish
    - cron: '17 */2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync from qoshkopir-mmtb.uz
        continue-on-error: true
        run: node scripts/sync-mmtb.mjs

      - name: Save synced snapshot to repository
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain public/data/mmtb-sync.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/mmtb-sync.json
            git commit -m "Sinxron: qoshkopir-mmtb.uz ma'lumotlari yangilandi"
            git push
          fi

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
